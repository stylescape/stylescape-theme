---

# =============================================================================
# Dependabot Configuration
# =============================================================================
#
# Only the ecosystems this repository has. The base branch is `main`, the
# default branch, so no `target-branch`. Updates are grouped so a week is a
# few PRs, not ten; major versions still arrive as their own PRs.

version: 2

updates:

  # NPM dependencies
  # ===========================================================================

  -
    package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    commit-message:
      prefix: "dependabot-npm"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    groups:
      stylescape:
        patterns:
          - "stylescape"
          - "@*/stylescape-*"
          - "unit.gl"
          - "hue.gl"
      dev-tooling:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"


  # GitHub Actions dependencies
  # ===========================================================================

  -
    package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    commit-message:
      prefix: "dependabot-github-actions"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"


  # devContainer dependencies
  # ===========================================================================

  -
    package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    commit-message:
      prefix: "dependabot-devcontainer"
      include: "scope"
    labels:
      - "dependencies"
      - "devcontainer"

  -
    package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    commit-message:
      prefix: "dependabot-devcontainer"
      include: "scope"
    labels:
      - "dependencies"
      - "devcontainer"
